# Эталон: push PromoStaff Hunter, 23.06.2026
# Фокус: primary category + строка адреса на карточке
# Источник: лента подписчика (фрагменты текста из push)

meta:
  date: "2026-06-23"
  author: owner
  purpose: "Роль и 📍 — не базовый ingest"

cases:
  - id: jun23_promo_vdnh_ok
    title: "Промо ВДНХ — эталон «хорошо»"
    text: |
      Пресс-мероприятие одного крупного московского проекта
      Ищем промо с опытом работы на конференциях/форумах/выставках
      Презентабельная девушка, до 25 лет
      м. ВДНХ
      23 июня (СЕГОДНЯ), с 15:30 до 19:00
      Оплата 3500р
      @ramil_ve
    bot_wrong:
      role: promoter
      address: "metro:вднх"
    expected_ingest: true
    expected_primary_category: promoter
    expected_address: "м. ВДНХ"
    notes: "Контрольный «как должно быть»."

  - id: jun23_promo_vdnh_foto_line
    title: "Тот же заказ — в 📍 попала строка про фото"
    text: |
      Ищем промо с опытом работы на конференциях/форумах/выставках
      м. ВДНХ
      ФОТО - 2 штуки (портрет и полный рост).
      23 июня, с 15:30, Оплата 3500р
      @ramil_ve
    bot_wrong:
      role: promoter
      address: "ФОТО - 2"
    expected_ingest: true
    expected_primary_category: promoter
    expected_address: "м. ВДНХ"
    notes: "Дубль кампании; адрес из соседнего поста / метро в тексте, не требование к фото."

  - id: jun23_promo_chekhov
    title: "Промо Чехов — в 📍 фраза «взять 4 промоутеров»"
    text: |
      27 июня. На мероприятие нужен промо на машине (парень или девочка)
      Мероприятие будет в Чехове
      Нужно будет взять с собой 4 промоутера от метро, там поработать и вернуть к метро
      выдавать кофе гостям, работа на регистрации
      @ruslan_smyshlyaev
    bot_wrong:
      role: promoter
      address: "Нужно будет взять с собой 4"
    expected_ingest: true
    expected_primary_category: promoter
    expected_address: "Чехов, МО"
    notes: "Город в теле поста; не путать с задачей «привезти людей»."

  - id: jun23_security_vakhta
    title: "Охрана вахта — не разовая смена"
    text: |
      Требуются сотрудники охраны с удостоверением!!!
      Московской области
      4000 ₽/смена
      График вахта 15х15, 30х30, проживание, питание
      Прямой работодатель. Выплаты два раза в месяц.
    bot_wrong:
      role: security
      address: "Московской области"
    expected_ingest: false
    reject_reason: permanent
    expected_primary_category: reject
    expected_address: null
    notes: "Вахта/постоянка — не целевой продукт Hunter (разовые смены)."

  - id: jun23_fasovka_dubrovka
    title: "Фасовка на производстве — не чистый грузчик"
    text: |
      Требуется на подработку 24 июня. Работа не тяжелая
      мцк Дубровка или метро Дубровка, торговый центр Мозаика, 1 этаж
      Фасовка / упаковка сухой смеси в баночки
      женщина от 23 до 45 лет, с 11 до 18.30, 3700 за смену
    bot_wrong:
      role: loader
      address: "мцк Дубровка или метро Дубровка ,торговый центр Мозаика ... фасовщик"
    expected_ingest: true
    expected_primary_category: handyman
    expected_address: "м. Дубровка, ТЦ Мозаика"
    notes: "Упаковка/фасовка → handyman или misc; в 📍 без телефона и слова «фасовщик»."

  - id: jun23_loader_khodynka
    title: "Грузчики Ходынка — адрес ок"
    text: |
      Сегодня 3 человека к 10:30
