      Задача: выгрузить 5 ящиков 130кг, ремни с собой
      Оплата: 500/ч, 2000 за смену
      @artem_logist34
    bot_wrong:
      role: loader
      address: "Москва, Ходынский бульвар 22, Задача: выгрузить..."
    expected_ingest: true
    expected_primary_category: loader
    expected_address: "м. ЦСКА / Ходынский б-р, 22"
    notes: "Обрезать задачу из поля адреса."

  - id: jun23_loader_sokolniki
    title: "Сокольники — адрес в тексте, 📍 пустой"
